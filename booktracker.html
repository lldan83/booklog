<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #0a0a0a;

  #app { max-width: 480px; margin: 0 auto; padding: 24px 16px 100px; }

  .goal-progress { font-size: 12px; color: #a3a3a3; margin-bottom: 20px; }
  .sync-status { font-size: 11px; color: #525252; }

  .divider { height: 1px; background: #262626; margin: 16px 0; }

  .book-title { font-size: 15px; color: #f5f5f5; }
  .book-title .ebook-tag { font-size: 11px; color: #a3a3a3; margin-left: 6px; }
  .dday { font-size: 12px; color: #a3a3a3; }

    padding: 2px 6px; border-radius: 3px; letter-spacing: 0.5px;

  .spark-bar { width: 2px; flex-shrink: 0; background: #374151; border-radius: 1px 1px 0 0; }
  .sparkline-placeholder { height: 18px; margin-bottom: 6px; font-size: 11px; color: #525252; display: flex; align-items: center; }
  .spark-marker-row { display: flex; gap: 2px; margin-bottom: 6px; }
  .spark-marker-cell { width: 2px; flex-shrink: 0; }
  .spark-marker-dot { width: 2px; height: 3px; border-radius: 1px; }
  .book-check { font-size: 12px; margin-left: 5px; }

</style>

<script>
// ==================== FIREBASE REST API ====================
(function() {
  var API_KEY = 'AIzaSyBQF2t6hzHod0aTIwm9BM-Muh-K5mqgAFU';
  var PROJECT = 'booklog-490911';
  var REST_URL = 'https://firestore.googleapis.com/v1/projects/' + PROJECT + '/databases/(default)/documents/booktracker/data';

  var _pendingSave = null;
  var _saveInProgress = false;
  var _retryTimer = null;

  function _setStatus(text) {
    var el = document.getElementById('sync-status');
    if (el) el.textContent = text;
  }

  function _doSave(data) {
    if (_saveInProgress) return;
    _saveInProgress = true;
    _setStatus('저장 중...');
    var body = JSON.stringify({ fields: { payload: { stringValue: JSON.stringify(data) } } });
    fetch(REST_URL + '?key=' + API_KEY, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: body
    })
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function() {
      _saveInProgress = false;
      _pendingSave = null;
      if (_retryTimer) { clearTimeout(_retryTimer); _retryTimer = null; }
      _setStatus('동기화됨');
    })
    .catch(function(e) {
      _saveInProgress = false;
      _setStatus('미저장 - 재시도 중');
      console.error('[Booktracker] 저장 실패:', e.message);
      if (_retryTimer) clearTimeout(_retryTimer);
      _retryTimer = setTimeout(function() {
        if (_pendingSave) { var d = _pendingSave; _pendingSave = null; _doSave(d); }
      }, 5000);
    });
  }

  function _doSaveKeepalive(data) {
    var body = JSON.stringify({ fields: { payload: { stringValue: JSON.stringify(data) } } });
    try {
      fetch(REST_URL + '?key=' + API_KEY, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true
      }).catch(function() {});
    } catch(e) {}
  }

  window.firebaseSave = function(data) {
    _pendingSave = data;
    if (!_saveInProgress) _doSave(data);
  };

  window.firebaseLoad = function(callback) {
    fetch(REST_URL + '?key=' + API_KEY)
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(d) {
      try { callback(JSON.parse(d.fields.payload.stringValue)); }
      catch(e) { callback(null); }
    })
    .catch(function() { callback(null); });
  };

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden' && window._lastSavedDb) _doSaveKeepalive(window._lastSavedDb);
  });
  window.addEventListener('pagehide', function() {
    if (window._lastSavedDb) _doSaveKeepalive(window._lastSavedDb);
  });
  window.addEventListener('beforeunload', function() {
    if (window._lastSavedDb) _doSaveKeepalive(window._lastSavedDb);
  });

  _setStatus('연결 중...');
  fetch(REST_URL + '?key=' + API_KEY)
  .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(function(d) {
    var cloudData = JSON.parse(d.fields.payload.stringValue);
    var localRaw = localStorage.getItem('booktracker_data');
    if (localRaw) {
      try {
        var localData = JSON.parse(localRaw);
        var cloudTs = cloudData._savedAt || '';
        var localTs = localData._savedAt || '';
        if (localTs > cloudTs) {
          window._cloudData = localData;
          window._needsUpload = true;
        } else {
          window._cloudData = cloudData;
        }
      } catch(e) { window._cloudData = cloudData; }
    } else {
      window._cloudData = cloudData;
    }
    _setStatus('연결됨');
  })
  .catch(function(e) {
    console.error('[Booktracker] Firebase 로드 실패:', e.message);
    _setStatus('연결 실패');
  })
  .finally(function() {
    window._firebaseReady = true;
    if (window._waitingForFirebase) window._waitingForFirebase();
  });
})();
</script>

<script>
// ==================== DATA STORE ====================
// book: { id, title, totalPages, currentPage(항상 페이지 단위), format:'paper'|'ebook',
//         deadline:'YYYY-MM-DD', startDate:'YYYY-MM-DD', color:'#hex',
//         status: 'active'|'completed'|'deleted',
//         completedDate:'YYYY-MM-DD', deletedDate:'YYYY-MM-DD', preCompletePage:number(완독 취소용 복원값),
//         history: { 'YYYY-MM-DD': 그날 읽은 페이지 증가량(delta) } }
// db.dailyGoal: { date:'YYYY-MM-DD', perBook: { bookId: 그날 고정된 할당량 } }
//   - 읽어도 안 줄어듦. 책 추가/구조 변경(총쪽수·마감일·형태) 시 즉시 반영.
//   - 완독은 목표 유지(오늘 계획한 걸 해낸 것), 삭제는 그 몫만큼 즉시 차감(계획에서 제외).
let db = { books: [] };
let editingId = null;

const COLOR_PALETTE = ['#60a5fa','#f472b6','#facc15','#4ade80','#a78bfa','#22d3ee','#fb923c','#c084fc','#2dd4bf','#f87171'];

function save() {
  db._savedAt = new Date().toISOString();
  localStorage.setItem('booktracker_data', JSON.stringify(db));
  window._lastSavedDb = db;
  if (window.firebaseSave) window.firebaseSave(db);
}

function load() {
  const cloudData = window._cloudData;
  if (cloudData) {
    db = cloudData;
    window._cloudData = null;
    localStorage.setItem('booktracker_data', JSON.stringify(db));
    if (window._needsUpload) {
      window._needsUpload = false;
      if (window.firebaseSave) window.firebaseSave(db);
    }
  } else {
    const raw = localStorage.getItem('booktracker_data');
    if (raw) { try { db = JSON.parse(raw); } catch(e) {} }
  }
  if (!db.books) db.books = [];
  db.books.forEach(b => {
    if (!b.status) b.status = b.archived ? 'completed' : 'active'; // 이전 데이터 호환
  });
  renderAll();
}

// ==================== DATE HELPERS (KST) ====================
// Intl로 서울 시간대 기준 오늘 날짜를 직접 계산 (브라우저 시간대 설정과 무관하게 항상 정확)
const _kstFormatter = new Intl.DateTimeFormat('en-CA', {
  timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit'
});
function todayStr() {
  return _kstFormatter.format(new Date());
}
function toDate(str) { return new Date(str + 'T00:00:00+09:00'); }
function daysBetween(a, b) { return Math.round((toDate(b) - toDate(a)) / 86400000); }
// KST 기준으로 정확한 날짜 문자열을 뽑기 위한 헬퍼 (toISOString은 UTC라 하루 밀리는 버그가 있었음)
function dateStrAtKST(epochMs) { return _kstFormatter.format(new Date(epochMs)); }
function endOfMonthStr() {
  const d = toDate(todayStr());
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  const y = last.getFullYear(), m = String(last.getMonth()+1).padStart(2,'0'), dd = String(last.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}

// ==================== CALC ====================
function daysLeft(book) {
  const diff = daysBetween(todayStr(), book.deadline);
  return Math.max(1, diff + 1); // 오늘 포함
}
function remainingPages(book) { return Math.max(0, book.totalPages - book.currentPage); }
function todayAllocPages(book) {
  const r = remainingPages(book);
  if (r <= 0) return 0;
  return Math.ceil(r / daysLeft(book));
}
function progressPct(book) {
  if (book.totalPages <= 0) return 0;
  return Math.min(100, Math.round((book.currentPage / book.totalPages) * 100));
}
function pageToPercent(book, page) {
  if (book.totalPages <= 0) return 0;
  return Math.round((page / book.totalPages) * 100);
}
function percentToPage(book, pct) {
  return Math.round((pct / 100) * book.totalPages);
}

function activeBooks() { return db.books.filter(b => b.status === 'active').sort((a,b) => a.deadline < b.deadline ? -1 : a.deadline > b.deadline ? 1 : 0); }

// ---- 고정 목표(dailyGoal): 하루 시작 시점 스냅샷. 읽어도 안 줄어들고, 책 추가/구조 변경 시에만 반영 ----
function ensureDailyGoal() {
  const t = todayStr();
  if (!db.dailyGoal || db.dailyGoal.date !== t) {
    const perBook = {};
    activeBooks().forEach(b => { perBook[b.id] = todayAllocPages(b); });
    db.dailyGoal = { date: t, perBook: perBook };
  }
}
function goalTotal() {
  if (!db.dailyGoal) return 0;
  return Object.values(db.dailyGoal.perBook).reduce((a, b) => a + b, 0);
}
function getBookAlloc(book) {
  if (db.dailyGoal && db.dailyGoal.perBook.hasOwnProperty(book.id)) return db.dailyGoal.perBook[book.id];
  return todayAllocPages(book);
}
function achievedToday() {
  const t = todayStr();
  let sum = 0;
  db.books.forEach(b => { if (b.history && b.history[t]) sum += b.history[t]; });
  return Math.max(0, sum);
}

function assignColor() {
  const used = db.books.filter(b => b.status === 'active').map(b => b.color);
  const avail = COLOR_PALETTE.filter(c => !used.includes(c));
  const pool = avail.length > 0 ? avail : COLOR_PALETTE;
  return pool[Math.floor(Math.random() * pool.length)];
}

// ==================== SPARKLINE ====================
function renderSparkline(book) {
  if (!book.startDate) {
    return `<div class="sparkline-placeholder">시작 전</div>`;
  }
  const start = book.startDate;
  const end = book.deadline;
  const totalDays = Math.max(1, daysBetween(start, end) + 1);
  const hist = book.history || {};
  const maxDelta = Math.max(1, ...Object.values(hist).map(v => Math.max(0, v)));
  const todayIndex = daysBetween(start, todayStr());

  let bars = '';
  let markers = '';
  for (let i = 0; i < totalDays; i++) {
    const dstr = dateStrAtKST(toDate(start).getTime() + i * 86400000);
    const delta = Math.max(0, hist[dstr] || 0);
    const h = delta > 0 ? Math.max(15, Math.round((delta / maxDelta) * 100)) : 0;
    const bg = delta > 0 ? book.color : '#374151';
    bars += `<div class="spark-bar" style="height:${h}%; background:${bg};"></div>`;

    if (i === todayIndex) {
      const markerColor = delta > 0 ? book.color : '#525252';
      markers += `<div class="spark-marker-cell"><div class="spark-marker-dot" style="background:${markerColor};"></div></div>`;
    } else {
      markers += `<div class="spark-marker-cell"></div>`;
    }
  }

  const markerRow = (todayIndex >= 0 && todayIndex < totalDays) ? `<div class="spark-marker-row">${markers}</div>` : '';
  return `<div class="sparkline">${bars}</div>${markerRow}`;
}

// ==================== RENDER ====================
function renderAll() {
  ensureDailyGoal();
  const books = activeBooks();
  const totalGoal = goalTotal();
  const achieved = achievedToday();
  const rate = totalGoal > 0 ? Math.round((achieved / totalGoal) * 100) : 0;

  document.getElementById('goal-number').innerHTML = `${totalGoal}<span>p</span>`;
  const dateLabel = toDate(todayStr()).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
  document.getElementById('goal-sub').textContent = `${dateLabel} · ${books.length}권`;
  document.getElementById('goal-progress').textContent = `${achieved}p 읽음 · 달성률 ${rate}%`;

  const listEl = document.getElementById('book-list');
  if (books.length === 0) {
    listEl.innerHTML = `<div class="empty-state">등록된 책이 없어요.<br>아래 버튼으로 책을 추가해보세요.</div>`;
    return;
  }

  listEl.innerHTML = books.map(book => {
    const dl = daysLeft(book);
    const urgent = dl <= 3;
    const ddayLabel = dl <= 0 ? 'D-day' : `D-${dl - 1}`;
    const ddayHtml = urgent
      ? `<span class="dday urgent">${ddayLabel}</span>`
      : `<span class="dday">${ddayLabel}</span>`;

    const isEbook = book.format === 'ebook';
    const alloc = getBookAlloc(book);
    const remaining = remainingPages(book);
    const pct = progressPct(book);
    const readToday = !!(book.history && book.history[todayStr()] > 0);
    const checkHtml = readToday ? `<span class="book-check" style="color:${book.color};">✓</span>` : '';

    let progressLabel, allocLabel;
    if (isEbook) {
      progressLabel = `${pct}%`;
      allocLabel = `오늘 ${pageToPercent(book, alloc)}% · 남은 ${100 - pct}%`;
    } else {
      progressLabel = `:${book.currentPage}/${book.totalPages} (${pct}%)`;
      allocLabel = `오늘 ${alloc}p · 남은 ${remaining}p`;
    }

    return `
      <div class="book-card" data-id="${book.id}">
        <div class="book-top">
          <span class="book-title">${escapeHtml(book.title)}${checkHtml}${isEbook ? '<span class="ebook-tag">전자책</span>' : ''}</span>
          ${ddayHtml}
        </div>
        ${renderSparkline(book)}
        <div class="book-meta-row">
          <span>${progressLabel}</span>
          <span class="today-alloc">${allocLabel}</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${pct}%; background:${book.color};"></div>
        </div>
      </div>
    `;
  }).join('');

  listEl.querySelectorAll('.book-card').forEach(card => {
    card.addEventListener('click', () => openModal(card.dataset.id));
  });
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ==================== MODAL ====================
const overlay = document.getElementById('modal-overlay');
let selectedFormat = 'paper';

function openModal(id) {
  editingId = id || null;
  const book = id ? db.books.find(b => b.id === id) : null;

  document.getElementById('modal-title-text').textContent = book ? 'EDIT_BOOK' : 'NEW_BOOK';
  document.getElementById('input-title').value = book ? book.title : '';
  document.getElementById('input-total').value = book ? book.totalPages : '';
  document.getElementById('input-startdate').value = book ? (book.startDate || '') : '';
  document.getElementById('input-deadline').value = book ? book.deadline : endOfMonthStr();
  updateStartdateHint();
  updateDeadlineHint();

  selectedFormat = book ? book.format : 'paper';
  updateFormatUI();

  const cpField = document.getElementById('current-page-field');
  const cpInput = document.getElementById('input-current');
  const recordDateInput = document.getElementById('input-record-date');
  if (book) {
    cpField.style.display = 'block';
    document.getElementById('current-page-label').textContent = book.format === 'ebook' ? '현재 진행률(%)' : '현재 페이지';
    cpInput.value = book.format === 'ebook' ? pageToPercent(book, book.currentPage) : book.currentPage;
    recordDateInput.value = todayStr();
    updateRecordDateHint();
  } else {
    cpField.style.display = 'none';
  }

  document.getElementById('submit-btn').textContent = book ? '저장하기' : '추가하기';
  document.getElementById('edit-actions').style.display = book ? 'flex' : 'none';

  overlay.classList.add('open');
}

function closeModal() { overlay.classList.remove('open'); editingId = null; }

function updateFormatUI() {
  document.querySelectorAll('.format-opt').forEach(el => {
    el.classList.toggle('selected', el.dataset.format === selectedFormat);
  });
  const cpLabel = document.getElementById('current-page-label');
  if (cpLabel) cpLabel.textContent = selectedFormat === 'ebook' ? '현재 진행률(%)' : '현재 페이지';
}

function updateDeadlineHint() {
  const val = document.getElementById('input-deadline').value;
  document.getElementById('deadline-hint').textContent = val === endOfMonthStr() ? '이번 달 말일' : '';
}
function updateStartdateHint() {
  const val = document.getElementById('input-startdate').value;
  document.getElementById('startdate-hint').textContent = val === todayStr() ? '오늘' : '';
}
function updateRecordDateHint() {
  const val = document.getElementById('input-record-date').value;
  document.getElementById('record-date-hint').textContent = val === todayStr() ? '오늘' : '';
}

document.querySelectorAll('.format-opt').forEach(el => {
  el.addEventListener('click', () => { selectedFormat = el.dataset.format; updateFormatUI(); });
});
document.getElementById('input-startdate').addEventListener('change', updateStartdateHint);
document.getElementById('input-deadline').addEventListener('change', updateDeadlineHint);
document.getElementById('input-record-date').addEventListener('change', updateRecordDateHint);
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('fab-add').addEventListener('click', () => openModal(null));
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

document.getElementById('submit-btn').addEventListener('click', () => {
  const title = document.getElementById('input-title').value.trim();
  const totalPages = parseInt(document.getElementById('input-total').value, 10);
  const startDate = document.getElementById('input-startdate').value;
  const deadline = document.getElementById('input-deadline').value;

  if (!title || !totalPages || totalPages <= 0 || !deadline) {
    alert('제목, 총 쪽수, 마감일을 입력해주세요.');
    return;
  }

  ensureDailyGoal(); // 오늘 목표 스냅샷이 없으면 먼저 만들어둠 (이후 여기서만 수동으로 수정)

  if (editingId) {
    const book = db.books.find(b => b.id === editingId);
    const oldTotal = book.totalPages, oldDeadline = book.deadline, oldFormat = book.format;

    book.title = title;
    book.totalPages = totalPages;
    book.startDate = startDate || null;
    book.deadline = deadline;
    book.format = selectedFormat;

    const cpVal = parseInt(document.getElementById('input-current').value, 10) || 0;
    const newCP = selectedFormat === 'ebook' ? percentToPage(book, cpVal) : cpVal;
    const recordDate = document.getElementById('input-record-date').value || todayStr();
    const delta = newCP - book.currentPage;
    if (!book.history) book.history = {};
    if (delta !== 0) {
      book.history[recordDate] = (book.history[recordDate] || 0) + delta;
    }
    book.currentPage = newCP;

    // 총쪽수/마감일/형태 같은 구조적 변경이 있을 때만 오늘 목표에 즉시 반영. 순수 페이지 업데이트는 목표 고정.
    const structuralChanged = (oldTotal !== totalPages) || (oldDeadline !== deadline) || (oldFormat !== selectedFormat);
    if (structuralChanged) {
      db.dailyGoal.perBook[book.id] = todayAllocPages(book);
    }
  } else {
    const book = {
      id: 'b' + Date.now(),
      title, totalPages,
      currentPage: 0,
      format: selectedFormat,
      startDate: startDate || null, deadline,
      color: assignColor(),
      status: 'active',
      history: {}
    };
    db.books.push(book);
    db.dailyGoal.perBook[book.id] = todayAllocPages(book); // 새 책 추가 -> 오늘 목표 즉시 증가
  }

  save();
  renderAll();
  closeModal();
});

document.getElementById('btn-complete').addEventListener('click', () => {
  const book = db.books.find(b => b.id === editingId);
  if (book && confirm('완독 처리할까요? 보관함(완독)으로 이동하고, 오늘 목표는 그대로 유지됩니다.')) {
    book.preCompletePage = book.currentPage; // 복원용 스냅샷
    book.currentPage = book.totalPages;
    book.status = 'completed';
    book.completedDate = todayStr();
    save();
    renderAll();
    closeModal();
  }
});

document.getElementById('btn-delete').addEventListener('click', () => {
  const book = db.books.find(b => b.id === editingId);
  if (book && confirm('이 책을 삭제할까요? 보관함(삭제됨)으로 이동하며, 오늘 목표에서 이 책의 할당량만큼 즉시 빠집니다.')) {
    ensureDailyGoal();
    if (db.dailyGoal.perBook.hasOwnProperty(editingId)) delete db.dailyGoal.perBook[editingId];
    book.status = 'deleted';
    book.deletedDate = todayStr();
    save();
    renderAll();
    closeModal();
  }
});

// ==================== ARCHIVE ====================
let archiveTab = 'completed';
const archiveOverlay = document.getElementById('archive-overlay');

document.getElementById('archive-link').addEventListener('click', () => {
  archiveTab = 'completed';
  document.querySelectorAll('.archive-tab').forEach(t => t.classList.toggle('selected', t.dataset.tab === 'completed'));
  renderArchive();
  archiveOverlay.classList.add('open');
});
document.getElementById('archive-close').addEventListener('click', () => archiveOverlay.classList.remove('open'));
archiveOverlay.addEventListener('click', (e) => { if (e.target === archiveOverlay) archiveOverlay.classList.remove('open'); });

document.querySelectorAll('.archive-tab').forEach(el => {
  el.addEventListener('click', () => {
    archiveTab = el.dataset.tab;
    document.querySelectorAll('.archive-tab').forEach(t => t.classList.toggle('selected', t.dataset.tab === archiveTab));
    renderArchive();
  });
});

function renderArchive() {
  const completed = db.books.filter(b => b.status === 'completed');
  const deleted = db.books.filter(b => b.status === 'deleted');
  document.getElementById('completed-count').textContent = completed.length;
  document.getElementById('deleted-count').textContent = deleted.length;

  const list = archiveTab === 'completed' ? completed : deleted;
  const listEl = document.getElementById('archive-list');

  if (list.length === 0) {
    listEl.innerHTML = `<div class="empty-state">${archiveTab === 'completed' ? '완독한 책이 없어요.' : '삭제된 책이 없어요.'}</div>`;
    return;
  }

  listEl.innerHTML = list.map(book => {
    let dateLabel, metaLine;
    if (archiveTab === 'completed') {
      dateLabel = (book.completedDate || '-').replace(/-/g, '.') + ' 완독';
      const days = (book.startDate && book.completedDate) ? (daysBetween(book.startDate, book.completedDate) + 1) : null;
      metaLine = `${book.totalPages}p${days ? ` · ${days}일간 읽음` : ''}`;
    } else {
      dateLabel = (book.deletedDate || '-').replace(/-/g, '.') + ' 삭제';
      metaLine = book.format === 'ebook'
        ? `전자책 · ${pageToPercent(book, book.currentPage)}%까지 읽음`
        : `${book.currentPage}/${book.totalPages}p까지 읽음`;
    }
    return `
      <div class="archive-item">
        <div class="archive-top">
          <span class="archive-title">${escapeHtml(book.title)}</span>
          <span class="archive-date">${dateLabel}</span>
        </div>
        <div class="archive-meta">${metaLine}</div>
        <div class="archive-actions">
          <div class="archive-btn restore" data-action="restore" data-id="${book.id}">복원</div>
          <div class="archive-btn perm-delete" data-action="perm-delete" data-id="${book.id}">완전 삭제</div>
        </div>
      </div>
    `;
  }).join('');

  listEl.querySelectorAll('[data-action="restore"]').forEach(el => {
    el.addEventListener('click', () => restoreBook(el.dataset.id));
  });
  listEl.querySelectorAll('[data-action="perm-delete"]').forEach(el => {
    el.addEventListener('click', () => permanentlyDeleteBook(el.dataset.id));
  });
}

function restoreBook(id) {
  const book = db.books.find(b => b.id === id);
  if (!book) return;
  if (book.status === 'completed' && book.preCompletePage != null) {
    book.currentPage = book.preCompletePage;
  }
  book.status = 'active';
  ensureDailyGoal();
  if (db.dailyGoal.date === todayStr()) {
    db.dailyGoal.perBook[book.id] = todayAllocPages(book); // 복원 -> 오늘 목표에 다시 반영
  }
  save();
  renderAll();
  renderArchive();
}

function permanentlyDeleteBook(id) {
  if (!confirm('완전히 삭제할까요? 이후에는 복원할 수 없습니다.')) return;
  db.books = db.books.filter(b => b.id !== id);
  save();
  renderArchive();
}

// ==================== INIT ====================
if (window._firebaseReady) {
  load();
} else {
  window._waitingForFirebase = load;
}

// 자정 재계산
let _lastCheckedDate = todayStr();
setInterval(() => {
  const now = todayStr();
  if (now !== _lastCheckedDate) { _lastCheckedDate = now; renderAll(); }
}, 60000);

// Firebase polling: 5분마다 확인
let _lastUserAction = Date.now();
document.addEventListener('click', () => { _lastUserAction = Date.now(); });
document.addEventListener('keydown', () => { _lastUserAction = Date.now(); });

setInterval(() => {
  if (Date.now() - _lastUserAction < 30000) return;
  if (!window.firebaseLoad) return;
  window.firebaseLoad((cloudData) => {
    if (!cloudData || !cloudData._savedAt) return;
    if (cloudData._savedAt > (db._savedAt || '')) {
      db = cloudData;
      renderAll();
    }
  });
}, 5 * 60 * 1000);
</script>
