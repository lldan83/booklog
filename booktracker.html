<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>book tracker</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: #0a0a0a;
    color: #e5e5e5;
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    min-height: 100vh;
  }
  #app { max-width: 480px; margin: 0 auto; padding: 24px 16px 100px; }

  /* ---- header ---- */
  .goal-label { font-size: 11px; color: #6b7280; letter-spacing: 1px; margin-bottom: 4px; }
  .goal-number { font-size: 40px; font-weight: 500; color: #f5f5f5; line-height: 1; margin-bottom: 6px; }
  .goal-number span { font-size: 18px; color: #a3a3a3; font-weight: 400; }
  .goal-sub { font-size: 12px; color: #6b7280; margin-bottom: 20px; }
  .sync-status { font-size: 11px; color: #525252; }

  .divider { height: 1px; background: #262626; margin: 16px 0; }

  /* ---- book card ---- */
  .book-card { margin-bottom: 24px; cursor: pointer; }
  .book-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .book-title { font-size: 15px; color: #f5f5f5; }
  .book-title .ebook-tag { font-size: 11px; color: #a3a3a3; margin-left: 6px; }
  .dday { font-size: 12px; color: #a3a3a3; }
  .dday.urgent {
    font-size: 10px; color: #f87171; background: #3f1d1d;
    padding: 2px 6px; border-radius: 3px; letter-spacing: 0.5px;
  }

  .sparkline { display: flex; gap: 2px; align-items: flex-end; height: 18px; margin-bottom: 6px; overflow: hidden; }
  .spark-bar { width: 2px; flex-shrink: 0; background: #374151; border-radius: 1px 1px 0 0; }

  .book-meta-row { display: flex; justify-content: space-between; font-size: 11px; color: #a3a3a3; margin-bottom: 4px; }
  .book-meta-row .today-alloc { color: #e5e5e5; }

  .progress-track { height: 3px; background: #262626; border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; }

  /* ---- empty state ---- */
  .empty-state { text-align: center; padding: 60px 20px; color: #6b7280; font-size: 13px; }

  /* ---- fab ---- */
  .fab {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 32px); max-width: 448px;
    text-align: center; padding: 12px; font-size: 13px; color: #d4d4d4;
    background: #1a1a1a; border: 1px solid #262626; border-radius: 6px;
  }

  /* ---- modal ---- */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 100; align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    width: 100%; max-width: 480px; background: #0a0a0a;
    border-radius: 12px 12px 0 0; padding: 20px 16px 28px;
    border-top: 1px solid #262626;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-title { font-size: 11px; color: #a3a3a3; letter-spacing: 1px; }
  .modal-close { font-size: 16px; color: #a3a3a3; background: none; border: none; cursor: pointer; padding: 4px; }

  .field { margin-bottom: 16px; }
  .field-label { font-size: 11px; color: #a3a3a3; margin-bottom: 6px; }
  .field input[type=text], .field input[type=number] {
    width: 100%; background: transparent; border: 1px solid #333; border-radius: 4px;
    padding: 8px 10px; font-size: 14px; color: #e5e5e5; font-family: inherit;
  }
  .field input::placeholder { color: #525252; }
  .field input:focus { outline: none; border-color: #525252; }

  .format-toggle { display: flex; gap: 8px; }
  .format-opt {
    flex: 1; text-align: center; padding: 8px; border-radius: 4px; font-size: 13px;
    border: 1px solid #333; color: #6b7280; cursor: pointer;
  }
  .format-opt.selected { background: #262626; color: #f5f5f5; border-color: #525252; }

  .deadline-row {
    border: 1px solid #333; border-radius: 4px; padding: 8px 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .deadline-row input[type=date] {
    background: transparent; border: none; color: #e5e5e5; font-family: inherit; font-size: 14px;
  }
  .deadline-hint { font-size: 11px; color: #6b7280; }

  .submit-btn {
    text-align: center; padding: 10px; font-size: 13px; color: #d4d4d4;
    background: #1a1a1a; border: 1px solid #262626; border-radius: 4px; cursor: pointer; margin-top: 8px;
  }
  .submit-btn:active { background: #262626; }

  .book-actions { display: flex; gap: 8px; margin-top: 20px; }
  .action-btn {
    flex: 1; text-align: center; padding: 9px; font-size: 12px; color: #a3a3a3;
    border: 1px solid #333; border-radius: 4px; cursor: pointer;
  }
  .action-btn.danger { color: #f87171; border-color: #3f1d1d; }
</style>
</head>
<body>

<div id="app">
  <div class="goal-label">TODAY_GOAL</div>
  <div class="goal-number" id="goal-number">0<span>p</span></div>
  <div class="goal-sub" id="goal-sub">-</div>
  <div class="sync-status" id="sync-status"></div>

  <div class="divider"></div>

  <div id="book-list"></div>
</div>

<div class="fab" id="fab-add">[ + 책 추가 ]</div>

<!-- 책 추가/수정 모달 -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-sheet">
    <div class="modal-header">
      <span class="modal-title" id="modal-title-text">NEW_BOOK</span>
      <button class="modal-close" id="modal-close">✕</button>
    </div>

    <div class="field">
      <div class="field-label">제목</div>
      <input type="text" id="input-title" placeholder="책 제목 입력">
    </div>

    <div class="field">
      <div class="field-label">총 쪽수</div>
      <input type="number" id="input-total" placeholder="0" inputmode="numeric">
    </div>

    <div class="field">
      <div class="field-label">형태</div>
      <div class="format-toggle">
        <div class="format-opt selected" data-format="paper">종이책</div>
        <div class="format-opt" data-format="ebook">전자책</div>
      </div>
    </div>

    <div class="field">
      <div class="field-label">마감일</div>
      <div class="deadline-row">
        <input type="date" id="input-deadline">
        <span class="deadline-hint" id="deadline-hint"></span>
      </div>
    </div>

    <div class="field" id="current-page-field" style="display:none;">
      <div class="field-label" id="current-page-label">현재 페이지</div>
      <input type="number" id="input-current" placeholder="0" inputmode="numeric">
    </div>

    <div class="submit-btn" id="submit-btn">추가하기</div>

    <div class="book-actions" id="edit-actions" style="display:none;">
      <div class="action-btn" id="btn-complete">완독 처리</div>
      <div class="action-btn danger" id="btn-delete">삭제</div>
    </div>
  </div>
</div>

<script>
// ==================== FIREBASE REST API ====================
(function() {
  var API_KEY = 'AIzaSyBQF2t6hzHod0aTIwm9BM-Muh-K5mqgAFU';
  var PROJECT = 'booklog-490911';
  var REST_URL = 'https://firestore.googleapis.com/v1/projects/' + PROJECT + '/databases/(default)/documents/booktracker/data';

  var _pendingSave = null;
  var _saveInProgress = false;
  var _retryTimer = null;

  function _setStatus(text) {
    var el = document.getElementById('sync-status');
    if (el) el.textContent = text;
  }

  function _doSave(data) {
    if (_saveInProgress) return;
    _saveInProgress = true;
    _setStatus('저장 중...');
    var body = JSON.stringify({ fields: { payload: { stringValue: JSON.stringify(data) } } });
    fetch(REST_URL + '?key=' + API_KEY, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: body
    })
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function() {
      _saveInProgress = false;
      _pendingSave = null;
      if (_retryTimer) { clearTimeout(_retryTimer); _retryTimer = null; }
      _setStatus('동기화됨');
    })
    .catch(function(e) {
      _saveInProgress = false;
      _setStatus('미저장 - 재시도 중');
      console.error('[Booktracker] 저장 실패:', e.message);
      if (_retryTimer) clearTimeout(_retryTimer);
      _retryTimer = setTimeout(function() {
        if (_pendingSave) { var d = _pendingSave; _pendingSave = null; _doSave(d); }
      }, 5000);
    });
  }

  function _doSaveKeepalive(data) {
    var body = JSON.stringify({ fields: { payload: { stringValue: JSON.stringify(data) } } });
    try {
      fetch(REST_URL + '?key=' + API_KEY, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true
      }).catch(function() {});
    } catch(e) {}
  }

  window.firebaseSave = function(data) {
    _pendingSave = data;
    if (!_saveInProgress) _doSave(data);
  };

  window.firebaseLoad = function(callback) {
    fetch(REST_URL + '?key=' + API_KEY)
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(d) {
      try { callback(JSON.parse(d.fields.payload.stringValue)); }
      catch(e) { callback(null); }
    })
    .catch(function() { callback(null); });
  };

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'hidden' && window._lastSavedDb) _doSaveKeepalive(window._lastSavedDb);
  });
  window.addEventListener('pagehide', function() {
    if (window._lastSavedDb) _doSaveKeepalive(window._lastSavedDb);
  });
  window.addEventListener('beforeunload', function() {
    if (window._lastSavedDb) _doSaveKeepalive(window._lastSavedDb);
  });

  _setStatus('연결 중...');
  fetch(REST_URL + '?key=' + API_KEY)
  .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(function(d) {
    var cloudData = JSON.parse(d.fields.payload.stringValue);
    var localRaw = localStorage.getItem('booktracker_data');
    if (localRaw) {
      try {
        var localData = JSON.parse(localRaw);
        var cloudTs = cloudData._savedAt || '';
        var localTs = localData._savedAt || '';
        if (localTs > cloudTs) {
          window._cloudData = localData;
          window._needsUpload = true;
        } else {
          window._cloudData = cloudData;
        }
      } catch(e) { window._cloudData = cloudData; }
    } else {
      window._cloudData = cloudData;
    }
    _setStatus('연결됨');
  })
  .catch(function(e) {
    console.error('[Booktracker] Firebase 로드 실패:', e.message);
    _setStatus('연결 실패');
  })
  .finally(function() {
    window._firebaseReady = true;
    if (window._waitingForFirebase) window._waitingForFirebase();
  });
})();
</script>

<script>
// ==================== DATA STORE ====================
// book: { id, title, totalPages, currentPage(항상 페이지 단위), format:'paper'|'ebook',
//         deadline:'YYYY-MM-DD', createdAt:'YYYY-MM-DD', color:'#hex', archived:bool,
//         history: { 'YYYY-MM-DD': currentPage } }
let db = { books: [] };
let editingId = null;

const COLOR_PALETTE = ['#60a5fa','#f472b6','#facc15','#4ade80','#a78bfa','#22d3ee','#fb923c','#c084fc','#2dd4bf','#f87171'];

function save() {
  db._savedAt = new Date().toISOString();
  localStorage.setItem('booktracker_data', JSON.stringify(db));
  window._lastSavedDb = db;
  if (window.firebaseSave) window.firebaseSave(db);
}

function load() {
  const cloudData = window._cloudData;
  if (cloudData) {
    db = cloudData;
    window._cloudData = null;
    localStorage.setItem('booktracker_data', JSON.stringify(db));
    if (window._needsUpload) {
      window._needsUpload = false;
      if (window.firebaseSave) window.firebaseSave(db);
    }
  } else {
    const raw = localStorage.getItem('booktracker_data');
    if (raw) { try { db = JSON.parse(raw); } catch(e) {} }
  }
  if (!db.books) db.books = [];
  renderAll();
}

// ==================== DATE HELPERS (KST) ====================
function todayStr() {
  const d = new Date();
  const kst = new Date(d.getTime() + (9 * 60 - d.getTimezoneOffset()) * 60000);
  return kst.toISOString().slice(0, 10);
}
function toDate(str) { return new Date(str + 'T00:00:00+09:00'); }
function daysBetween(a, b) { return Math.round((toDate(b) - toDate(a)) / 86400000); }
function endOfMonthStr() {
  const d = toDate(todayStr());
  const last = new Date(d.getFullYear(), d.getMonth() + 1, 0);
  const y = last.getFullYear(), m = String(last.getMonth()+1).padStart(2,'0'), dd = String(last.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}

// ==================== CALC ====================
function daysLeft(book) {
  const diff = daysBetween(todayStr(), book.deadline);
  return Math.max(1, diff + 1); // 오늘 포함
}
function remainingPages(book) { return Math.max(0, book.totalPages - book.currentPage); }
function todayAllocPages(book) {
  const r = remainingPages(book);
  if (r <= 0) return 0;
  return Math.ceil(r / daysLeft(book));
}
function progressPct(book) {
  if (book.totalPages <= 0) return 0;
  return Math.min(100, Math.round((book.currentPage / book.totalPages) * 100));
}
function pageToPercent(book, page) {
  if (book.totalPages <= 0) return 0;
  return Math.round((page / book.totalPages) * 100);
}
function percentToPage(book, pct) {
  return Math.round((pct / 100) * book.totalPages);
}

function activeBooks() { return db.books.filter(b => !b.archived).sort((a,b) => a.deadline < b.deadline ? -1 : a.deadline > b.deadline ? 1 : 0); }

function assignColor() {
  const used = db.books.filter(b => !b.archived).map(b => b.color);
  const avail = COLOR_PALETTE.filter(c => !used.includes(c));
  const pool = avail.length > 0 ? avail : COLOR_PALETTE;
  return pool[Math.floor(Math.random() * pool.length)];
}

// ==================== SPARKLINE ====================
function renderSparkline(book) {
  const start = book.createdAt;
  const end = book.deadline;
  const totalDays = Math.max(1, daysBetween(start, end) + 1);
  const hist = book.history || {};
  const dates = Object.keys(hist).sort();

  // 날짜별 누적값 -> 일별 증가량(delta) 계산
  const deltas = {};
  let prevVal = 0;
  dates.forEach(d => {
    const val = hist[d];
    deltas[d] = Math.max(0, val - prevVal);
    prevVal = val;
  });
  const maxDelta = Math.max(1, ...Object.values(deltas));

  let bars = '';
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(toDate(start).getTime() + i * 86400000);
    const dstr = d.toISOString().slice(0, 10);
    const delta = deltas[dstr] || 0;
    const h = delta > 0 ? Math.max(15, Math.round((delta / maxDelta) * 100)) : 0;
    const bg = delta > 0 ? book.color : '#374151';
    bars += `<div class="spark-bar" style="height:${h}%; background:${bg};"></div>`;
  }
  return `<div class="sparkline">${bars}</div>`;
}

// ==================== RENDER ====================
function renderAll() {
  const books = activeBooks();
  const totalGoal = books.reduce((sum, b) => sum + todayAllocPages(b), 0);

  document.getElementById('goal-number').innerHTML = `${totalGoal}<span>p</span>`;
  const dateLabel = toDate(todayStr()).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });
  document.getElementById('goal-sub').textContent = `${dateLabel} · ${books.length}권`;

  const listEl = document.getElementById('book-list');
  if (books.length === 0) {
    listEl.innerHTML = `<div class="empty-state">등록된 책이 없어요.<br>아래 버튼으로 책을 추가해보세요.</div>`;
    return;
  }

  listEl.innerHTML = books.map(book => {
    const dl = daysLeft(book);
    const urgent = dl <= 3;
    const ddayLabel = dl <= 0 ? 'D-day' : `D-${dl - 1}`;
    const ddayHtml = urgent
      ? `<span class="dday urgent">${ddayLabel}</span>`
      : `<span class="dday">${ddayLabel}</span>`;

    const isEbook = book.format === 'ebook';
    const alloc = todayAllocPages(book);
    const remaining = remainingPages(book);
    const pct = progressPct(book);

    let progressLabel, allocLabel;
    if (isEbook) {
      progressLabel = `${pct}%`;
      allocLabel = `오늘 ${pageToPercent(book, alloc)}% · 남은 ${100 - pct}%`;
    } else {
      progressLabel = `:${book.currentPage}/${book.totalPages} (${pct}%)`;
      allocLabel = `오늘 ${alloc}p · 남은 ${remaining}p`;
    }

    return `
      <div class="book-card" data-id="${book.id}">
        <div class="book-top">
          <span class="book-title">${escapeHtml(book.title)}${isEbook ? '<span class="ebook-tag">전자책</span>' : ''}</span>
          ${ddayHtml}
        </div>
        ${renderSparkline(book)}
        <div class="book-meta-row">
          <span>${progressLabel}</span>
          <span class="today-alloc">${allocLabel}</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" style="width:${pct}%; background:${book.color};"></div>
        </div>
      </div>
    `;
  }).join('');

  listEl.querySelectorAll('.book-card').forEach(card => {
    card.addEventListener('click', () => openModal(card.dataset.id));
  });
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ==================== MODAL ====================
const overlay = document.getElementById('modal-overlay');
let selectedFormat = 'paper';

function openModal(id) {
  editingId = id || null;
  const book = id ? db.books.find(b => b.id === id) : null;

  document.getElementById('modal-title-text').textContent = book ? 'EDIT_BOOK' : 'NEW_BOOK';
  document.getElementById('input-title').value = book ? book.title : '';
  document.getElementById('input-total').value = book ? book.totalPages : '';
  document.getElementById('input-deadline').value = book ? book.deadline : endOfMonthStr();
  updateDeadlineHint();

  selectedFormat = book ? book.format : 'paper';
  updateFormatUI();

  const cpField = document.getElementById('current-page-field');
  const cpInput = document.getElementById('input-current');
  if (book) {
    cpField.style.display = 'block';
    document.getElementById('current-page-label').textContent = book.format === 'ebook' ? '현재 진행률(%)' : '현재 페이지';
    cpInput.value = book.format === 'ebook' ? pageToPercent(book, book.currentPage) : book.currentPage;
  } else {
    cpField.style.display = 'none';
  }

  document.getElementById('submit-btn').textContent = book ? '저장하기' : '추가하기';
  document.getElementById('edit-actions').style.display = book ? 'flex' : 'none';

  overlay.classList.add('open');
}

function closeModal() { overlay.classList.remove('open'); editingId = null; }

function updateFormatUI() {
  document.querySelectorAll('.format-opt').forEach(el => {
    el.classList.toggle('selected', el.dataset.format === selectedFormat);
  });
  const cpLabel = document.getElementById('current-page-label');
  if (cpLabel) cpLabel.textContent = selectedFormat === 'ebook' ? '현재 진행률(%)' : '현재 페이지';
}

function updateDeadlineHint() {
  const val = document.getElementById('input-deadline').value;
  document.getElementById('deadline-hint').textContent = val === endOfMonthStr() ? '이번 달 말일' : '';
}

document.querySelectorAll('.format-opt').forEach(el => {
  el.addEventListener('click', () => { selectedFormat = el.dataset.format; updateFormatUI(); });
});
document.getElementById('input-deadline').addEventListener('change', updateDeadlineHint);
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('fab-add').addEventListener('click', () => openModal(null));
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

document.getElementById('submit-btn').addEventListener('click', () => {
  const title = document.getElementById('input-title').value.trim();
  const totalPages = parseInt(document.getElementById('input-total').value, 10);
  const deadline = document.getElementById('input-deadline').value;

  if (!title || !totalPages || totalPages <= 0 || !deadline) {
    alert('제목, 총 쪽수, 마감일을 모두 입력해주세요.');
    return;
  }

  if (editingId) {
    const book = db.books.find(b => b.id === editingId);
    book.title = title;
    book.totalPages = totalPages;
    book.deadline = deadline;
    book.format = selectedFormat;
    const cpVal = parseInt(document.getElementById('input-current').value, 10) || 0;
    book.currentPage = selectedFormat === 'ebook' ? percentToPage(book, cpVal) : cpVal;
    if (!book.history) book.history = {};
    book.history[todayStr()] = book.currentPage;
  } else {
    const book = {
      id: 'b' + Date.now(),
      title, totalPages,
      currentPage: 0,
      format: selectedFormat,
      deadline,
      createdAt: todayStr(),
      color: assignColor(),
      archived: false,
      history: {}
    };
    db.books.push(book);
  }

  save();
  renderAll();
  closeModal();
});

document.getElementById('btn-complete').addEventListener('click', () => {
  const book = db.books.find(b => b.id === editingId);
  if (book && confirm('완독 처리할까요? 목록에서 아카이브로 이동합니다.')) {
    book.archived = true;
    book.currentPage = book.totalPages;
    save();
    renderAll();
    closeModal();
  }
});

document.getElementById('btn-delete').addEventListener('click', () => {
  if (confirm('이 책을 삭제할까요? 되돌릴 수 없습니다.')) {
    db.books = db.books.filter(b => b.id !== editingId);
    save();
    renderAll();
    closeModal();
  }
});

// ==================== INIT ====================
if (window._firebaseReady) {
  load();
} else {
  window._waitingForFirebase = load;
}

// 자정 재계산
let _lastCheckedDate = todayStr();
setInterval(() => {
  const now = todayStr();
  if (now !== _lastCheckedDate) { _lastCheckedDate = now; renderAll(); }
}, 60000);

// Firebase polling: 5분마다 확인
let _lastUserAction = Date.now();
document.addEventListener('click', () => { _lastUserAction = Date.now(); });
document.addEventListener('keydown', () => { _lastUserAction = Date.now(); });

setInterval(() => {
  if (Date.now() - _lastUserAction < 30000) return;
  if (!window.firebaseLoad) return;
  window.firebaseLoad((cloudData) => {
    if (!cloudData || !cloudData._savedAt) return;
    if (cloudData._savedAt > (db._savedAt || '')) {
      db = cloudData;
      renderAll();
    }
  });
}, 5 * 60 * 1000);
</script>
